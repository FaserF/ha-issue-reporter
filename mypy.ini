[mypy]
explicit_package_bases = true
python_version = 3.13
ignore_missing_imports = True
check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_defs = True
warn_return_any = False
warn_unused_configs = False
disable_error_code = import-not-found, misc, union-attr, typeddict-unknown-key, typeddict-item, arg-type, return-value
exclude = ^(\.venv|scratch|scripts)/

[mypy-homeassistant.*]
ignore_missing_imports = True

[mypy-voluptuous.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[project]
name = "ha-issue-reporter"
version = "0.1.0"
description = "Home Assistant helper integration that monitors custom integration & Supervisor add-on logs and creates deduplicated, privacy-sanitized GitHub issues."
authors = [
    {name = "FaserF"}
]
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pyjwt[crypto]>=2.8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "SIM102", "SIM105", "SIM117", "E402", "B017", "B904", "ARG001", "RUF012", "BLE001"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.13"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = false
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "testing_config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-p no:socket"
